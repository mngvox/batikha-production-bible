name: Decode images
on:
  push:
    paths:
      - "encoded/**"
      - ".github/workflows/decode-images.yml"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 images and commit
        run: |
          set -euo pipefail
          mkdir -p images
          for f in encoded/*.b64; do
            out="images/$(basename "$f" .b64)"
            base64 -d "$f" > "$out"
            echo "wrote $out ($(wc -c < "$out") bytes)"
          done
          file images/* || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Decode workshop images from base64"
            git push
          fi
